# Dependabot will run on day 20 of each month at 03:41 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "41 3 20 * *"
    open-pull-requests-limit: 20
    assignees:
      - "MK-2001"
    versioning-strategy: "increase"
